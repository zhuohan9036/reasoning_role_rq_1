schema_version: "1.0"
generator_version: "1.0"
seed: 20260908
max_generation_attempts: 5000

families:
  function_composition:
    domain_size: 8
  relational_path: {}

# This configuration is reviewed but intentionally not executed locally.
# Counts use one record per fully crossed factor cell to avoid overstating the
# small relational family's semantic support before the calibration audit.
splits:
  train:
    kind: train
    count_per_family: 18
    factors:
      chain_lengths: [2, 3, 4]
      distractor_counts: [0, 1, 2]
      presentation_orders: [canonical, shuffled]
    render:
      function_composition:
        templates: [compact]
        vocabularies: [latin]
        answer_encodings: [symbol]
      relational_path:
        templates: [compact]
        vocabularies: [names_a]
        answer_encodings: [vector]

