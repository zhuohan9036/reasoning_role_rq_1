evaluation_schema_version: "1.0"
seed: 314159

dataset:
  manifest: tests/fixtures/task_calibration_smoke/manifest.json

backend:
  kind: fake
  prompt_mode: plain
  outcome_percentages:
    correct: 75
    wrong: 10
    invalid: 10
    failure: 5

generation:
  batch_size: 8
  max_new_tokens: 32
  do_sample: false

summary:
  strata:
    - family
    - split
    - chain_length
    - distractor_count
    - presentation_order
    - template_id
    - vocabulary_id
    - answer_encoding
    - model_id
    - prompt_mode

eligibility:
  overall_trimmed_exact_min: 0.80
  each_chain_length_trimmed_exact_min: 0.60
  invalid_or_inference_failure_max: 0.05
