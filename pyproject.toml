[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-role"
version = "0.1.0"
description = "Controlled task calibration for reasoning-role RQ1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
model = [
  "accelerate>=0.30",
  "torch>=2.2",
  "transformers>=4.41",
]

[project.scripts]
reasoning-role-generate = "reasoning_role.data.generate:main"
reasoning-role-evaluate = "reasoning_role.behavioral.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
